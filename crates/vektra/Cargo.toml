[package]
name = "vektra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
bench = false

[dependencies]
gpui = { workspace = true }
unicode-script = { workspace = true }
unicode-segmentation = { workspace = true }
vektra-assets = { workspace = true }
vektra-icons = { workspace = true, optional = true }
vektra-macros = { workspace = true }
vektra-theme = { workspace = true }

[dev-dependencies]
allocation-counter = { workspace = true }
criterion = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
image = "0.25.10"
trybuild = { workspace = true }

[features]
default = []
icons = ["dep:vektra-icons", "vektra-assets/icons"]
stress-bench = []

[[bench]]
name = "component_scalability"
harness = false

[[bench]]
name = "scalability_stress"
harness = false
required-features = ["stress-bench"]
