[package]
name = "vektra-theme"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "vektra_theme"
path = "src/lib.rs"
bench = false

[dependencies]
gpui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
vektra-assets = { workspace = true }

[dev-dependencies]
allocation-counter = { workspace = true }
criterion = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }

[features]
default = []
stress-bench = []

[[bench]]
name = "theme_scalability"
harness = false

[[bench]]
name = "theme_stress"
harness = false
required-features = ["stress-bench"]
