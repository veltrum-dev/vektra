name: Rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Smoke-test regular benchmark harnesses
        run: cargo test --workspace --benches

      - name: Check stress benchmark targets
        run: |
          cargo check -p vektra --bench scalability_stress --features stress-bench
          cargo check -p vektra-theme --bench theme_stress --features stress-bench

      - name: Validate performance budgets
        run: python -m json.tool performance-budgets.json > /dev/null

      - name: Run lazy materialization invariants
        run: |
          cargo test -p vektra --test virtual_list_behavior
          cargo test -p vektra --test select_lazy_data_source

  select-platforms:
    name: Select behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Run Select behavior tests
        run: cargo test -p vektra --test select_behavior
